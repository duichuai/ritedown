[package]
name = "ritedown"
version = "2.4.0"
description = "Ritedown — an open-source Markdown editor"
edition = "2021"

[lib]
name = "ritedown_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# direct PDF export: WebView2 PrintToPdf (no print dialog)
[target.'cfg(windows)'.dependencies]
webview2-com = "0.39"
windows = { version = "0.62", default-features = false }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
